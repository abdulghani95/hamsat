name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          mkdir www
          cp index.html style.css logic.js api.js config.js app.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png icon-maskable-512.png www/
          # the app learns its build number and repository, to tell you when a newer APK is released
          printf '\nwindow.HAMSA_BUILD = %s;\nwindow.HAMSA_REPO = "%s";\n' "${{ github.run_number }}" "${{ github.repository }}" >> www/config.js
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/app@7
          npx cap init "همسة" com.hamsa.messenger --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add the speaker plugin and the notification icon
        run: |
          dir=android/app/src/main/java/com/hamsa/messenger
          mkdir -p "$dir" android/app/src/main/res/drawable
          cp AudioRoutePlugin.java SaveMediaPlugin.java MainActivity.java "$dir/"
          cp icon-192.png android/app/src/main/res/drawable/ic_stat.png

      - name: Microphone permission, version number and a fixed signing key
        run: |
          # voice messages and calls need the microphone, video calls the camera
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # every build gets a higher version so it installs over the previous one
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # the same key every time, so updates install over the old app
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Use the Hamsa icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in *anydpi*) continue ;; esac
            cp icon-512.png "$d/ic_launcher.png"
            cp icon-512.png "$d/ic_launcher_round.png"
            cp icon-512.png "$d/ic_launcher_foreground.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hamsa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hamsa-apk
          path: hamsa.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: همسة ${{ github.run_number }}
          files: hamsa.apk
